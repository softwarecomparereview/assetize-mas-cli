# Assetize fork-only: build the MAS CLI image from the three Assetize forks and push it to GHCR.
# Not for upstream contribution (blocked by .assetize/hooks/pre-push).
name: Assetize CLI image

on:
  push:
    branches: [master, "andy/**"]
    tags: ["assetize-*"]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: assetize-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Never run in IBM's repository
    if: github.repository_owner == 'softwarecomparereview'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/softwarecomparereview/mas-cli
      PYTHON_DEVOPS_DIR: ${{ github.workspace }}/assetize-python-devops
      ANSIBLE_DEVOPS_DIR: ${{ github.workspace }}/assetize-ansible-devops
    steps:
      - name: Checkout assetize-mas-cli
        uses: actions/checkout@v4
        with:
          path: assetize-mas-cli

      # Use the branch with the same name in the sibling forks when it exists (cross-repo changes
      # share a branch name), otherwise their default branch
      - name: Resolve sibling fork branches
        id: refs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pick() {
            if git ls-remote --exit-code --heads "https://github.com/$1.git" "$BRANCH" > /dev/null 2>&1; then echo "$BRANCH"; else echo "$2"; fi
          }
          echo "python_devops=$(pick softwarecomparereview/assetize-python-devops stable)" >> "$GITHUB_OUTPUT"
          echo "ansible_devops=$(pick paananiruddh/assetize-ansible-devops master)" >> "$GITHUB_OUTPUT"

      - name: Checkout assetize-python-devops
        uses: actions/checkout@v4
        with:
          repository: softwarecomparereview/assetize-python-devops
          ref: ${{ steps.refs.outputs.python_devops }}
          path: assetize-python-devops

      - name: Checkout assetize-ansible-devops
        uses: actions/checkout@v4
        with:
          repository: paananiruddh/assetize-ansible-devops
          ref: ${{ steps.refs.outputs.ansible_devops }}
          path: assetize-ansible-devops

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build ansible-core

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        working-directory: assetize-mas-cli
        env:
          PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Floating tags: "latest" on master, "<tag>" on assetize-* tags, sanitised branch name otherwise
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export IMAGE_TAG="$REF_NAME"
          elif [[ "$REF_NAME" == "master" ]]; then
            export EXTRA_TAGS="latest"
          else
            export EXTRA_TAGS="branch-$(echo "$REF_NAME" | tr -c 'a-zA-Z0-9_.-' '-' | cut -c1-100 | sed 's/-*$//')"
          fi
          assetize/image/build.sh

      - name: Summary
        run: |
          {
            echo "### Assetize MAS CLI image"
            echo ""
            echo "- Image: \`${{ steps.build.outputs.image }}\`"
            echo "- python-devops: \`${{ steps.refs.outputs.python_devops }}\`"
            echo "- ansible-devops: \`${{ steps.refs.outputs.ansible_devops }}\`"
            echo ""
            echo "Run it: \`docker run -ti --rm -e IBM_ENTITLEMENT_KEY ${{ steps.build.outputs.image }} bash\`"
          } >> "$GITHUB_STEP_SUMMARY"
